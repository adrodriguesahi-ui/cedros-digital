name: Build Android APK

# Compila o app nativo (Capacitor) num runner do GitHub, que tem acesso
# normal ao repositório do Google (dl.google.com) — diferente de ambientes
# de rede restrita, onde o Android Gradle Plugin nem consegue baixar. O APK
# gerado fica disponível como artifact desta execução (aba Actions do repo)
# e também é publicado num Release fixo (tag apk-latest), com um link de
# download direto que não expira e não pede login no GitHub.

permissions:
  contents: write

on:
  push:
    paths:
      - 'index.html'
      - 'login.html'
      - 'manifest.json'
      - 'sw.js'
      - 'icons/**'
      - 'icon-*.png'
      - 'apple-touch-icon.png'
      - '.well-known/**'
      - 'android/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - 'scripts/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Sem "packages", a action instala o pacote 'tools', que o Google tirou
      # do repositório — o sdkmanager sai com erro antes de o build começar.
      # O resto do SDK o Gradle baixa sozinho, com as licenças já aceitas aqui.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Instalar dependências
        run: npm install

      - name: Gerar www/ e sincronizar o projeto Android
        run: npm run cap:sync

      - name: Compilar APK de debug
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: cedros-digital-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publicar/atualizar release com link fixo de download
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk

          # Antes isto perguntava com "gh release view" se o release existia pra
          # escolher entre criar e atualizar. Quando essa consulta falha — e ela
          # já falhou, depois de cinco minutos pendurada — a resposta vira "não
          # existe", o passo tenta CRIAR o release que já está lá e o build
          # inteiro quebra no fim, com o APK pronto e sem publicar.
          #
          # Agora tenta atualizar primeiro, que é o caso de sempre, e só cria se
          # o upload falhar. Sem pergunta, sem resposta errada.
          enviar(){ gh release upload apk-latest "$APK" --clobber --repo "$GITHUB_REPOSITORY"; }

          criar(){ gh release create apk-latest "$APK" \
              --title "Cedros Digital — APK mais recente" \
              --notes "Build automático a cada atualização do app. Este link nunca muda." \
              --repo "$GITHUB_REPOSITORY"; }

          # Três tentativas: a API do GitHub oscila, e perder o APK por uma
          # falha de rede passageira custa um build inteiro.
          for tentativa in 1 2 3; do
            if enviar; then exit 0; fi
            echo "Upload falhou (tentativa $tentativa)."
            # Release ainda não existe: cria. Se a criação funcionar, acabou;
            # se disser que já existe, foi oscilação — o laço tenta o upload de novo.
            if criar; then exit 0; fi
            sleep $((tentativa * 10))
          done
          echo "Não consegui publicar o APK no release depois de 3 tentativas." >&2
          exit 1
