name: Build Android APK

# Compila o app nativo (Capacitor) num runner do GitHub, que tem acesso
# normal ao repositório do Google (dl.google.com) — diferente de ambientes
# de rede restrita, onde o Android Gradle Plugin nem consegue baixar. O APK
# gerado fica disponível como artifact desta execução (aba Actions do repo),
# pra baixar e instalar direto no celular, sem precisar de Android Studio.

on:
  push:
    paths:
      - 'index.html'
      - 'login.html'
      - 'manifest.json'
      - 'sw.js'
      - 'icons/**'
      - 'icon-*.png'
      - 'apple-touch-icon.png'
      - '.well-known/**'
      - 'android/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - 'scripts/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Instalar dependências
        run: npm install

      - name: Gerar www/ e sincronizar o projeto Android
        run: npm run cap:sync

      - name: Compilar APK de debug
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: cedros-digital-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
